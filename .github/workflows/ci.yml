# Three independent jobs so each keeps its own red/green mark. What each gate
# actually checks lives in stylua.toml / .luacheckrc / scripts/test.sh -- this
# workflow only wires those up, it does not re-specify them. Run the same
# three locally with `stylua --check .`, `luacheck .` and `scripts/test.sh`.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .

  luacheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # PUC Lua 5.4, not LuaJIT: `std = "luajit"` in .luacheckrc pins which
      # globals/stdlib luacheck checks *against* -- independent of which
      # interpreter runs the luacheck binary itself.
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck 1.2.0
      - run: luacheck .

  tests:
    # Both OSes the plugin is actually used on: Windows isn't just "also
    # supported" here, it's the primary author's own daily driver -- a
    # bash-isms regression (path separators, scripts/test.sh's own shell
    # syntax) would otherwise only ever surface after the fact, on someone's
    # real machine, never in CI.
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # lib.nvim is a runtime dependency (json, tables.path_flatten, notify,
      # usercmd.composer, config) -- a headless run has no plugin manager, so
      # it is checked out the way scripts/minimal_init.lua's `.deps/`
      # candidate expects. color_my_ascii.nvim and pickers.nvim are optional
      # soft deps guarded by pcall() in the specs that need them, so they are
      # deliberately not checked out here.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      # plenary.nvim: the busted-compatible test harness the specs under
      # TESTS/ are written against.
      - uses: actions/checkout@v5
        with:
          repository: nvim-lua/plenary.nvim
          path: .deps/plenary.nvim
          # Pinned to the 2026-09-20 HEAD; bump deliberately, not by drifting.
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      # windows-latest's default shell is pwsh, not bash -- scripts/test.sh
      # is a bash script (Git for Windows ships one on every windows-latest
      # runner, actions/checkout already needs it).
      - run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          scripts/test.sh
        shell: bash
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
