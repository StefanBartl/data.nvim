# Three independent jobs so each keeps its own red/green mark. What each gate
# actually checks lives in stylua.toml / .luacheckrc / scripts/test.sh -- this
# workflow only wires those up, it does not re-specify them. Run the same
# three locally with `stylua --check .`, `luacheck .` and `scripts/test.sh`.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .

  luacheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # PUC Lua 5.4, not LuaJIT: `std = "luajit"` in .luacheckrc pins which
      # globals/stdlib luacheck checks *against* -- independent of which
      # interpreter runs the luacheck binary itself.
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install luacheck 1.2.0
      - run: luacheck .

  tests:
    # Both OSes the plugin is actually used on: Windows isn't just "also
    # supported" here, it's the primary author's own daily driver -- a
    # bash-isms regression (path separators, scripts/test.sh's own shell
    # syntax) would otherwise only ever surface after the fact, on someone's
    # real machine, never in CI.
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # lib.nvim is a runtime dependency (json, tables.path_flatten, notify,
      # usercmd.composer, config) -- a headless run has no plugin manager, so
      # it is checked out the way TESTS/minimal_init.lua's `.deps/`
      # candidate expects. color_my_ascii.nvim, pickers.nvim and diff.nvim are
      # optional for the plugin itself (guarded by pcall() in the specs that
      # need them) but listed in .testing.lua, so the run loads them and those
      # specs really run; testing.nvim is the runner.
      - uses: actions/checkout@v5
        with:
          repository: WKDSteve/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      # Checked out from the branch that only moves once the dependency's own CI is green.
      - uses: actions/checkout@v5
        with:
          repository: "WKDSteve/testing.nvim"
          path: .deps/testing.nvim
          ref: ci-verified
      # Checked out from the branch that only moves once the dependency's own CI is green.
      - uses: actions/checkout@v5
        with:
          repository: "WKDSteve/color_my_ascii.nvim"
          path: .deps/color_my_ascii.nvim
          ref: ci-verified
      # Checked out from the branch that only moves once the dependency's own CI is green.
      - uses: actions/checkout@v5
        with:
          repository: "WKDSteve/diff.nvim"
          path: .deps/diff.nvim
          ref: ci-verified
      # Checked out from the branch that only moves once the dependency's own CI is green.
      - uses: actions/checkout@v5
        with:
          repository: "WKDSteve/pickers.nvim"
          path: .deps/pickers.nvim
          ref: ci-verified
      # windows-latest's default shell is pwsh, not bash -- scripts/test.sh
      # is a bash script (Git for Windows ships one on every windows-latest
      # runner, actions/checkout already needs it).
      - run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          scripts/test.sh --json "$RUNNER_TEMP/testing-ir.json"
        shell: bash
      - name: Conformance gate
        shell: bash
        run: bash scripts/test.sh conformance
      # The IR of the Linux run carries the surface the specs exercised: the baseline (surface.baseline.json) is
      # written from exactly this artifact, so it matches what the runner measures.
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && always()
        with:
          name: surface-ir
          path: ${{ runner.temp }}/testing-ir.json
          if-no-files-found: ignore
          retention-days: 7
      # Regression gate for the surface (docs/SURFACE.md of testing.nvim): a command, keymap or autocommand that the specs
      # exercised when surface.baseline.json was written must still be exercised. Linux only: the baseline comes from
      # the Linux run. To accept an intended change, rewrite the file from a green Linux run (`scripts/test.sh surface
      # --from <ir> --write-baseline surface.baseline.json`, IR = the surface-ir artifact) and review the diff.
      - name: Surface baseline gate
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/test.sh surface --from "$RUNNER_TEMP/testing-ir.json" --baseline surface.baseline.json --require-signed-baseline
      # The IR is what a reporter or a person reads to find out WHICH case failed on WHICH platform.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: testing-ir-${{ matrix.os }}
          path: ${{ runner.temp }}/testing-ir.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14
